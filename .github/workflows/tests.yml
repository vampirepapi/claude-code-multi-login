name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday: catches Claude Code updates that break an assumption

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh and a virtual display
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb
      - name: Install the real Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run tests
        env:
          CCA_REAL_CLAUDE: "1"
        run: xvfb-run -a python -m unittest discover -s tests -v

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          CCA_SKIP_GUI: "1"
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
